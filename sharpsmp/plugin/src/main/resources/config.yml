# SharpSMP — edit this file, then run /sharpsmp reload
# Money amounts accept 500, 1.5k, 2m, and 1b in commands.

currency:
  name: Sharps
  symbol: "$"
  starting-balance: 1500

spawn:
  world: world
  center-x: 0
  center-y: 220
  center-z: 0
