name: Build SharpSMP

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Test and package
        working-directory: sharpsmp/plugin
        run: mvn -B -ntp test package

      - uses: actions/upload-artifact@v4
        with:
          name: SharpSMP
          path: sharpsmp/plugin/target/SharpSMP.jar
          if-no-files-found: error

      - name: Publish plugin jar
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Paper 26.3 plugin built by GitHub Actions. Put SharpSMP.jar in the server plugins folder."
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 sharpsmp/plugin/target/SharpSMP.jar --clobber
          else
            gh release create v1.0.0 sharpsmp/plugin/target/SharpSMP.jar \
              --title "SharpSMP 1.0.0" \
              --notes "$notes"
          fi
